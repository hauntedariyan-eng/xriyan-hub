#XRIYAN HUB
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XRIYAN HUB</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            text-align: center;
            padding: 15px;
            margin: 0;
        }
        h1 { color: #38bdf8; margin-bottom: 5px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .card:hover { border-color: #38bdf8; transform: translateY(-2px); }
        .card h3 { font-size: 14px; margin: 8px 0 0 0; color: #f8fafc; }
        .icon { font-size: 30px; }
    </style>
</head>
<body>

    <h1>🎮 XRIYAN HUB</h1>
    <p>Select your game for instant top-up</p>

    <div class="grid">
        <div class="card" onclick="alert('MLBB Selected!')">
            <div class="icon">💎</div>
            <h3>Mobile Legends</h3>
        </div>
        <div class="card" onclick="alert('HoK Selected!')">
            <div class="icon">👑</div>
            <h3>Honor of Kings</h3>
        </div>
        <div class="card" onclick="alert('FF Selected!')">
            <div class="icon">🔥</div>
            <h3>Free Fire</h3>
        </div>
        <div class="card" onclick="alert('PUBG Selected!')">
            <div class="icon">🪖</div>
            <h3>PUBG Mobile</h3>
        </div>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    </script>
</body>
</html>
